name: Desktop
on:
  push:
    branches: [main]
    paths: ['src/**', 'global.json', 'Directory.Build.props', '.github/workflows/desktop.yml', 'scripts/fetch-assets.py']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch licensed application font
        run: python scripts/fetch-assets.py
      - name: Compile native Uno host
        run: dotnet build src/PdfSpace.App -f net10.0-desktop -c Release -p:PdfSpaceDesktopOnly=true
