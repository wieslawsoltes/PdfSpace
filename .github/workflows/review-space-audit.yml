name: Review source-space audit
on:
  push:
    branches: [build/space-audit-0.6.2]
    paths: [.github/workflows/review-space-audit.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/space-audit-0.6.2
          fetch-depth: 0
      - name: Apply exact reviewed delta
        env:
          TRANSFER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'c2c23134a223e81f3e33e498464572c5c98ce734'
          git fetch origin "$TRANSFER_COMMIT"
          python3 - <<'PY'
          import os,subprocess,base64,lzma,hashlib,pathlib
          encoded=subprocess.check_output(['git','show',f'{os.environ["TRANSFER_COMMIT"]}:tools/space-audit/review.b64'])
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='933f57ee5654a77f58728f735ef32b3711581d8971da2309cc0aa4d3eb79c670'
          pathlib.Path('/tmp/review.patch').write_bytes(patch)
          PY
          git apply --check /tmp/review.patch
          git apply /tmp/review.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = '4b576588a65a5d96f536764904ce4a6ec213a7b0'
          git commit -m 'fix: classify direct font descriptors and keep source audit observational'
          git push origin HEAD:feat/space-audit-0.6.2
