name: Finish bounded inspector
on:
  push:
    branches: [test/dense-open-054]
    paths: [.github/workflows/finish-inspector.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/snap-editing-0.5.4
          fetch-depth: 0
      - name: Verify source delta and exact resulting tree
        env:
          TRANSFER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '77a92b211712d8fbafb754f9b31ae56f722873fd'
          git fetch origin "$TRANSFER_COMMIT"
          python3 - <<'PY'
          import os,subprocess,base64,lzma,hashlib,pathlib
          chunks=[subprocess.check_output(['git','show',f'{os.environ["TRANSFER_COMMIT"]}:tools/finish054/{i}.b64']).decode().strip() for i in range(1,4)]
          patch=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='90541f4a3dc4abd1ab84f283b4cfcc8d557890b1828cac14c0d231554fcad6a2'
          pathlib.Path('/tmp/finish.patch').write_bytes(patch)
          print('Verified',len(patch),'bytes of reviewed source changes')
          PY
          git apply --check --exclude='.github/workflows/*' /tmp/finish.patch
          git apply --exclude='.github/workflows/*' /tmp/finish.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = 'eb94ecac85af58d48fc297bcb5d60c16e179a54f'
          git commit -m 'feat: bounded full-range object inspector and robust browser file lifecycle'
          git push origin HEAD:feat/snap-editing-0.5.4
