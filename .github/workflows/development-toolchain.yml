name: Development toolchain
on:
  push:
    branches: [feat/pdf-workflows-0.2]
    paths: ['.github/workflows/development-toolchain.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore validation dependencies
        shell: bash
        run: |
          dotnet restore tests/PdfSpace.Tests
          mkdir -p /tmp/pdfspace-deps
          printf '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="PDFsharp" Version="6.2.4"/></ItemGroup></Project>' > /tmp/pdfspace-deps/Dependencies.csproj
          dotnet restore /tmp/pdfspace-deps/Dependencies.csproj
          git clone --depth 1 --branch v6.2.4 https://github.com/empira/PDFsharp.git /tmp/pdfsharp-source || git clone --depth 1 https://github.com/empira/PDFsharp.git /tmp/pdfsharp-source
          python - <<'PY'
          import json,urllib.request
          for package in ['pdfsharp','uno.sdk','pdfpig']:
              versions=json.load(urllib.request.urlopen('https://api.nuget.org/v3-flatcontainer/'+package+'/index.json'))['versions']
              print(package, [v for v in versions if '-' not in v][-3:])
          PY
      - name: Collect engine-only toolchain and upstream API sources
        shell: bash
        run: |
          mkdir -p /tmp/toolchain/dotnet /tmp/toolchain/nuget /tmp/toolchain/upstream
          cp /usr/share/dotnet/dotnet /tmp/toolchain/dotnet/
          cp -r /usr/share/dotnet/host /tmp/toolchain/dotnet/
          mkdir -p /tmp/toolchain/dotnet/sdk /tmp/toolchain/dotnet/shared/Microsoft.NETCore.App /tmp/toolchain/dotnet/packs
          cp -r /usr/share/dotnet/sdk/10.0.401 /tmp/toolchain/dotnet/sdk/
          cp -r /usr/share/dotnet/shared/Microsoft.NETCore.App/10.0.* /tmp/toolchain/dotnet/shared/Microsoft.NETCore.App/
          cp -r /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref /tmp/toolchain/dotnet/packs/
          cp -r /usr/share/dotnet/packs/Microsoft.NETCore.App.Host.linux-x64 /tmp/toolchain/dotnet/packs/
          cp -r "$HOME/.nuget/packages/." /tmp/toolchain/nuget/
          rm -rf /tmp/pdfsharp-source/.git
          cp -r /tmp/pdfsharp-source/src /tmp/toolchain/upstream/pdfsharp
          tar -czf /tmp/PdfSpace-engine-toolchain.tar.gz -C /tmp/toolchain .
      - uses: actions/upload-artifact@v4
        with:
          name: PdfSpace-engine-toolchain
          path: /tmp/PdfSpace-engine-toolchain.tar.gz
          retention-days: 1
          compression-level: 0
