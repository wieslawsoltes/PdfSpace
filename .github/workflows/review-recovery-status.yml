name: Review recovery feedback
on:
  push:
    branches: [build/attachment-authoring-0.6.4]
    paths: [.github/workflows/review-recovery-status.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attachment-authoring-0.6.4
          fetch-depth: 0
      - name: Verify and apply reviewed UI changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '945ed203aee7a6700405313966125626fe016c92'
          python3 - <<'PY'
          import base64,lzma,hashlib,pathlib
          encoded=''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='7358854ac6d0170ab63c96862c9102bde3da8f430224874ead10bf29ce48aff8'
          pathlib.Path('/tmp/recovery.patch').write_bytes(patch)
          PY
          git apply --check /tmp/recovery.patch
          git apply /tmp/recovery.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'fix: isolate per-tab recovery progress from editing feedback and bound dropped input'
          git push origin HEAD:feat/attachment-authoring-0.6.4
