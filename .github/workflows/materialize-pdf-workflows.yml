name: Materialize PDF workflows
on:
  push:
    branches: [feat/pdf-workflows-0.2]
    paths: ['.github/workflows/materialize-pdf-workflows.yml']
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pdf-workflows-0.2
          fetch-depth: 1
      - name: Verify and apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for SHA in 46361a63aa65ca5d749a1adf5dafd5dbf7040953 eac221f5f7a3bdd06955d5973e2794170beddb74 207f7780315b85c34e15868eabd66d44f2f4c6ae 82993641aec6b34a61581fcf61dfbbb97ce3b2cb; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$SHA" --jq .content | base64 --decode >> /tmp/source.patch.gz
          done
          gzip -dc /tmp/source.patch.gz > /tmp/source.patch
          echo '9d5e76a1e49b17b27cc379e82024b6c7797e25035e00436c5a975ce5df63df9b  /tmp/source.patch' | sha256sum --check
          git apply --stat /tmp/source.patch
          git apply --check /tmp/source.patch
          git apply /tmp/source.patch
          git diff --check
          git add src tests PdfSpace.slnx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: native PDF editing, forms, annotations, protection and raster redaction'
          git push origin HEAD:feat/pdf-workflows-0.2
