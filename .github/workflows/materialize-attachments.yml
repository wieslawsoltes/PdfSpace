name: Materialize attachment explorer
on:
  push:
    branches: [build/attachments-0.6.3]
    paths: [.github/workflows/materialize-attachments.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attachments-0.6.3
          fetch-depth: 0
      - name: Verify source delta and resulting tree
        env:
          TRANSFER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'de3327c48086df04049666c8f5769ccde2cdee6b'
          git fetch origin "$TRANSFER_COMMIT"
          python3 - <<'PY'
          import os,subprocess,base64,lzma,hashlib,pathlib
          chunks=[subprocess.check_output(['git','show',f'{os.environ["TRANSFER_COMMIT"]}:tools/attachments/{i}.b64']).decode().strip() for i in range(1,4)]
          patch=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='edf452a66bb8d0f6fc19f0148cb8f3ed86a27ac8c214309d778bf4e278efc65a'
          pathlib.Path('/tmp/attachments.patch').write_bytes(patch)
          print('Verified',len(patch),'bytes of source changes')
          PY
          git apply --check /tmp/attachments.patch
          git apply /tmp/attachments.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = '8b2687030e173d100309e0132e35e07afa16946e'
          git commit -m 'feat: native attachment explorer with confirmed bounded downloads'
          git push origin HEAD:feat/attachments-0.6.3
