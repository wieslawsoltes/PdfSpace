name: Materialize rotation and snapping
on:
  push:
    branches: [build/rotation-snapping-0.5.3]
    paths: [.github/workflows/materialize-manipulation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/rotation-snapping-0.5.3
          fetch-depth: 0
      - name: Verify exact source delta and resulting tree
        env:
          TRANSFER_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '86a97ebb1876e54437f0a28846ef8486fa48bdc3'
          git fetch origin "$TRANSFER_COMMIT"
          python3 - <<'PY'
          import os,subprocess,base64,lzma,hashlib,pathlib
          chunks=[subprocess.check_output(['git','show',f'{os.environ["TRANSFER_COMMIT"]}:tools/manipulation053/{i}.b64']).decode().strip() for i in range(1,4)]
          patch=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ade4d8b8b40d051d2760d8be575fa4e4b06d305675828b9d5fc0c14bd5809dc3'
          pathlib.Path('/tmp/manipulation.patch').write_bytes(patch)
          print('Verified',len(patch),'bytes of reviewed source changes')
          PY
          git apply --check --unidiff-zero /tmp/manipulation.patch
          git apply --unidiff-zero /tmp/manipulation.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = '45cb0ac3c98b98ee4601c288c5ce0adc0cd58166'
          git commit -m 'feat: direct native object rotation and indexed alignment snapping'
          git push origin HEAD:feat/rotation-snapping-0.5.3
