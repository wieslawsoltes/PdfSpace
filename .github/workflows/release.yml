name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 0.4.1-alpha.1
        required: true
        type: string
      publish_nuget:
        description: Publish packages to nuget.org using NUGET_API_KEY
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo 'Invalid package version' >&2; exit 1; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Validate and publish browser package
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
          dotnet run --project tests/PdfSpace.Tests -c Release
          mkdir -p artifacts/fixtures
          cp artifacts/engine/*.pdf artifacts/engine/*.png artifacts/engine/*.jpg artifacts/fixtures/
          dotnet publish src/PdfSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:Version="$VERSION" -p:WasmShellWebAppBasePath=/PdfSpace/
          python3 scripts/collect-site.py artifacts/publish artifacts/site
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py --directory artifacts/site --port 4173 > artifacts/server.log 2>&1 &
          npm run test:browser
          bash scripts/verify-browser-exports.sh artifacts/browser-exports
          for project in src/*/*.csproj; do
            case "$project" in */PdfSpace.App/*) continue;; esac
            dotnet pack "$project" -c Release -p:Version="$VERSION" -o artifacts/packages
          done
          git archive --format=zip --output="artifacts/PdfSpace-$VERSION-source.zip" HEAD
          (cd artifacts/site && zip -qr "../PdfSpace-$VERSION-browser.zip" .)
          (cd artifacts/packages && sha256sum *.nupkg > SHA256SUMS.txt)
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPTIONS=(--verify-tag --generate-notes --title "PdfSpace $VERSION")
          if [[ "$VERSION" == *-* ]]; then OPTIONS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/packages/* "artifacts/PdfSpace-$VERSION-source.zip" "artifacts/PdfSpace-$VERSION-browser.zip" "${OPTIONS[@]}"
      - name: Optional NuGet publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo 'NUGET_API_KEY is not configured.' >&2; exit 1; fi
          dotnet nuget push 'artifacts/packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PdfSpace-release-${{ steps.version.outputs.value }}
          path: |
            artifacts/packages
            artifacts/*-source.zip
            artifacts/*-browser.zip
            artifacts/screenshots
            artifacts/playwright-report
            artifacts/browser-results.xml
            artifacts/browser-exports
          if-no-files-found: ignore
