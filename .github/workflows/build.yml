name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/PdfSpace.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PdfSpace-engine-validation
          path: artifacts/engine
          if-no-files-found: ignore
