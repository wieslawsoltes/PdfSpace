name: Verify stack
on:
  push:
    paths: ['.github/workflows/verify-stack.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify released package versions
        run: |
          dotnet --version
          python - <<'PY'
          import json,urllib.request,zipfile,io
          for name in ['uno.sdk','uno.winui','skiasharp','pdfpig.rendering.skia','pdfpig','pdfsharp']:
              data=json.load(urllib.request.urlopen('https://api.nuget.org/v3-flatcontainer/'+name+'/index.json'))
              stable=[v for v in data['versions'] if '-' not in v]
              print(name,'STABLE',stable[-4:],'RECENT',data['versions'][-3:])
          for name,version in [('uno.sdk','6.7.30'),('pdfpig.rendering.skia','0.1.14.1-alpha007')]:
              try:
                  data=urllib.request.urlopen(f'https://api.nuget.org/v3-flatcontainer/{name}/{version}/{name}.{version}.nupkg').read()
                  z=zipfile.ZipFile(io.BytesIO(data))
                  for f in z.namelist():
                      if f.endswith('.nuspec') or f.endswith('ImplicitPackages.props') or f.endswith('packages.json'):
                          print(f, z.read(f).decode()[:20000])
              except Exception as ex: print(ex)
          PY
